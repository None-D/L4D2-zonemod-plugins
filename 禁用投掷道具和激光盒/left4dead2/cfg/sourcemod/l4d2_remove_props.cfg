// 求生之路 2：禁用普通油桶、煤气罐、氧气瓶、激光指示盒。
// 1 = 启用该项，0 = 关闭该项。
l4d2_remove_props_enable "1"
l4d2_remove_props_gascan "1"
l4d2_remove_props_propane "1"
l4d2_remove_props_oxygen "1"
l4d2_remove_props_laser "1"

// 默认保留任务油桶（例如死亡中心终章、清道夫模式）。
// 改成 0 会连任务油桶一起删除，可能导致无法通关或无法得分。
// 第三方地图若把普通红色油桶用于任务，需要关闭 gascan 项。
l4d2_remove_props_keep_scavenge "1"
