// L4D2 Strict Map Spawns 1.1.0
// Changes take full effect on the NEXT map/round.

// Nearby gun markers form a station if within this distance (Source units),
// within the height tolerance, and with an unobstructed path between them.
l4d2_strict_station_radius "160.0"
l4d2_strict_station_height "48.0"

// Number of pickups for EACH of the two gun types at a station.
// 5 lets a normal four-player team share either type. Set 1 for one gun each.
l4d2_strict_weapon_count "5"

// Pill total is fixed at TWO per round; there is intentionally no refill CVar.
// Gun stations are capped at FIVE per round, INCLUDING both saferooms.
// If there are more initial stations, five complete stations are selected randomly.
// Delayed spawns share this quota. Consumed stations do not free a slot.
// Chainsaw world spawns are removed without creating replacement gun stations.
// Ammo piles are preserved. No game director CVar is modified.
